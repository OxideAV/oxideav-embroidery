[package]
name = "oxideav-embroidery"
version = "0.0.2"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Mark Karpeles"]
description = "Pure-Rust machine-embroidery design formats — Tajima DST, Brother PES/PEC/PHC/PHB/PHX, Melco EXP, Janome JEF and the Husqvarna/Compucon header families, decode + encode"
repository = "https://github.com/OxideAV/oxideav-embroidery"
homepage = "https://github.com/OxideAV/oxideav-embroidery"
readme = "README.md"
keywords = ["embroidery", "dst", "pes", "tajima", "brother"]
categories = ["multimedia::encoding", "parser-implementations"]

[dependencies]
oxideav-core = { version = "0.1", optional = true }

[features]
default = ["registry"]
# oxideav-core framework integration (registry + demuxer + vector
# decoder). Disable for the dependency-free standalone build.
registry = ["dep:oxideav-core"]
