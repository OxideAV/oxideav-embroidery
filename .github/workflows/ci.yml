name: CI

# Thin shim around the OxideAV org-level reusable workflow. See
# https://github.com/OxideAV/.github for the actual job definitions and
# the input surface. Miri runs by default per the org-wide policy.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    secrets: inherit

  # The `registry` feature (default-on) carries the oxideav-core
  # integration; this leg proves the dependency-free standalone build
  # path stays healthy with the feature off.
  ci-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --no-default-features
      - run: cargo test --no-default-features
      - run: cargo clippy --no-default-features --all-targets --no-deps -- -D warnings
